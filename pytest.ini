[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature coverage tests
    tier2: Tier 2 Boundary & corner case tests
    tier3: Tier 3 Cross-feature combination tests
    tier4: Tier 4 Real-world application scenario tests
    r1: Requirement R1 (Short 05 delivery)
    r2: Requirement R2 (Batch extension)
    r3: Requirement R3 (Audio, layout, and branding compliance)
    m1: Milestone M1 (Short 05 verification)
    m2: Milestone M2 (Batch verification)
