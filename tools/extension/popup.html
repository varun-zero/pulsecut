<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PulseCut Auto-Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 332px;
      background: #0b0b0d;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #222229;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #141418;
      border: 1px solid #2b2b34;
      display: grid;
      place-items: center;
      color: #53fc18;
      font-weight: 900;
      font-size: 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a1a1aa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ef4444;
    }
    .dot.ok {
      background: #53fc18;
      box-shadow: 0 0 8px rgba(83, 252, 24, 0.65);
    }
    .tab-card {
      background: #141418;
      border: 1px solid #23232b;
      border-radius: 10px;
      padding: 10px 11px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .tab-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tab-label {
      font-size: 10.5px;
      color: #8e8e98;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .tab-channel {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-platform {
      font-size: 10.5px;
      color: #53fc18;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tab-stats {
      font-size: 10.5px;
      color: #a1a1aa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .watched-section {
      background: #141418;
      border: 1px solid #23232b;
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .watched-section.visible {
      display: flex;
    }
    .watched-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 112px;
      overflow-y: auto;
    }
    .watched-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 7px;
      background: #1b1b21;
      border: 1px solid #272730;
      cursor: pointer;
      color: #f4f4f6;
      text-align: left;
      width: 100%;
    }
    .watched-item:hover {
      border-color: #3f3f4e;
    }
    .watched-name {
      font-size: 11.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .watched-meta {
      font-size: 10px;
      color: #a1a1aa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .watched-meta.hot {
      color: #53fc18;
      font-weight: 700;
    }
    .btn-primary {
      width: 100%;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      color: #09090b;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .field {
      margin-bottom: 10px;
    }
    .field-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
    }
    .val {
      font-size: 11px;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input[type="text"],
    select {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #26262f;
      background: #141418;
      color: #f4f4f6;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus,
    select:focus {
      border-color: #3b82f6;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #53fc18;
      cursor: pointer;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #222229;
    }
    .link-btn {
      font-size: 11.5px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }
    .hint {
      font-size: 10.5px;
      color: #71717a;
      min-height: 15px;
    }
    .hint.ok { color: #53fc18; }
    .hint.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-mark">P</span>
      <span>PulseCut</span>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking…</span>
    </div>
  </div>

  <div class="tab-card">
    <div class="tab-row">
      <span class="tab-label">Active Tab</span>
      <span class="tab-platform" id="tabPlatform">—</span>
    </div>
    <div class="tab-channel" id="tabChannel">Open Kick, Twitch, YouTube Live, or Reels</div>
    <div class="tab-stats" id="tabStats">Adaptive baseline scales to viewer count</div>
    <button type="button" class="btn-primary" id="clipNowBtn" disabled>
      Clip Active Tab Now
    </button>
    <div class="hint" id="actionHint">Shortcut on stream tabs: Alt+Shift+C</div>
  </div>

  <div class="watched-section" id="watchedSection">
    <div class="tab-row">
      <span class="tab-label">Monitored Stream Tabs</span>
      <span class="tab-platform" id="watchedCount">0 tabs</span>
    </div>
    <div class="watched-list" id="watchedList"></div>
  </div>

  <div class="field">
    <div class="field-head">
      <label for="mode">Extension Mode</label>
    </div>
    <select id="mode">
      <option value="manual">Manual Clip Only (Recommended — Use Direct-Link for Auto)</option>
      <option value="auto">Browser Auto-Clip (DOM Fallback)</option>
      <option value="alert">Alert Toast Only</option>
      <option value="off">Off (Hide HUD)</option>
    </select>
  </div>

  <div class="field">
    <div class="field-head">
      <label for="threshold">Hype Sensitivity Threshold</label>
      <span class="val" id="thresholdVal">55%</span>
    </div>
    <input type="range" id="threshold" min="25" max="90" step="5" value="55">
  </div>

  <div class="field">
    <div class="field-head">
      <label for="lookbackSecs">Clip Lookback Window</label>
      <span class="val" id="lookbackVal">30s</span>
    </div>
    <input type="range" id="lookbackSecs" min="15" max="90" step="5" value="30">
  </div>

  <div class="field">
    <div class="field-head">
      <label for="cooldownSecs">Auto-Clip Cooldown</label>
      <span class="val" id="cooldownVal">45s</span>
    </div>
    <input type="range" id="cooldownSecs" min="15" max="120" step="5" value="45">
  </div>

  <div class="field">
    <div class="field-head">
      <label for="serverUrl">PulseCut Server URL</label>
    </div>
    <input type="text" id="serverUrl" value="http://127.0.0.1:8756" placeholder="http://127.0.0.1:8756">
  </div>

  <div class="footer">
    <a class="link-btn" id="openEditorLink" href="http://127.0.0.1:8756" target="_blank" rel="noreferrer">
      Open PulseCut Editor →
    </a>
    <span class="hint" id="saveStatus"></span>
  </div>

  <script src="hypeEngine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
